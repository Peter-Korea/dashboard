<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 청렴감사팀 업무 대시보드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;--surface:#FFFFFF;--surface2:#F1EFF9;
  --border:#E2E0F0;--border2:#C8C4E8;
  --text:#1A1730;--text2:#5A5580;--text3:#9490B0;
  --accent:#4B3FA8;--accent-soft:#EEECfb;--accent-text:#3530A0;
  --done:#1A8C63;--done-soft:#E6F5EF;
  --warn:#C07010;--warn-soft:#FEF4E0;
  --danger:#B83030;--danger-soft:#FCEAEA;
  --info:#2060B0;--info-soft:#E8F0FA;
  --radius:8px;--radius-lg:12px;
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{overflow-y:auto;height:100vh}
.sb-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sb-logo-mark{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center}
.sb-logo-mark svg{width:16px;height:16px;fill:white}
.sb-org{font-size:13px;font-weight:600;color:var(--text)}
.sb-year{font-size:11px;color:var(--text3);margin-top:1px}
.sb-nav{padding:12px 8px;flex:1}
.sb-section{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;padding:8px 8px 4px}
.nav-btn{width:100%;padding:8px 10px;border-radius:var(--radius);border:none;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .12s;font-family:inherit}
.nav-btn:hover{background:var(--accent-soft);color:var(--accent)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-count{margin-left:auto;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.proj-item{padding:7px 10px;border-radius:var(--radius);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:8px}
.proj-item:hover{background:var(--surface2)}
.proj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.proj-name{font-size:12px;color:var(--text2);line-height:1.3;flex:1}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border)}
.sb-sync{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--done);flex-shrink:0}
.sync-dot.err{background:var(--danger)}
.sync-dot.loading{background:var(--warn);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.page{padding:24px 28px;display:none}
.page.active{display:block}
.page-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.stat-val{font-size:26px;font-weight:600;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.stat.accent{background:var(--accent);border-color:var(--accent)}
.stat.accent .stat-label,.stat.accent .stat-val,.stat.accent .stat-sub{color:rgba(255,255,255,.9)}
.stat.accent .stat-val{color:#fff}
.alert-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);border:1px solid;font-size:13px}
.alert-item.danger{background:var(--danger-soft);border-color:#F0BBBB;color:var(--danger)}
.alert-item.warn{background:var(--warn-soft);border-color:#F0D0A0;color:var(--warn)}
.tasks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.task-card:hover{border-color:var(--border2);box-shadow:0 2px 12px rgba(75,63,168,.08)}
.tc-header{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:10px}
.tc-info{flex:1;min-width:0}
.tc-project{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
.status-badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;cursor:pointer}
.st-완료{background:var(--done-soft);color:var(--done)}
.st-진행중{background:var(--info-soft);color:var(--info)}
.st-예정{background:var(--accent-soft);color:var(--accent-text)}
.st-지연{background:var(--danger-soft);color:var(--danger)}
.st-검토중{background:var(--warn-soft);color:var(--warn)}
.tc-body{padding:0 16px 12px}
.tc-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tc-date{font-size:12px;color:var(--text3)}
.tc-assignee{font-size:12px;color:var(--text2);background:var(--surface2);padding:2px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;cursor:pointer;border:1px solid var(--border)}
.tc-assignee:hover{border-color:var(--border2)}
.tc-avatar{width:16px;height:16px;border-radius:50%;background:var(--accent);color:white;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tc-files{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.file-chip{font-size:11px;padding:3px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);display:flex;align-items:center;gap:4px}
.file-ext{font-weight:700;font-size:10px}
.ext-pdf{color:#C03030}.ext-xlsx{color:#1A7040}.ext-docx{color:#1A50A0}.ext-pptx{color:#C06020}.ext-hwp{color:#3060C0}
.tc-footer{padding:0 16px 12px;display:flex;gap:6px;align-items:center}
.tc-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .12s}
.tc-btn:hover{background:var(--surface2);color:var(--text)}
.tc-btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.upload-area{margin:0 16px 12px;border:1px dashed var(--border2);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;position:relative;transition:all .15s}
.upload-area:hover,.upload-area.drag{border-color:var(--accent);background:var(--accent-soft)}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-txt{font-size:11px;color:var(--text3)}
.upload-txt strong{color:var(--accent)}
.prog-bar{height:2px;background:var(--border);border-radius:1px;margin-top:6px;display:none}
.prog-fill{height:100%;background:var(--accent);border-radius:1px;width:0%;transition:width .25s}
.tl-wrap{display:flex;flex-direction:column}
.tl-month-head{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.06em;padding:16px 0 8px}
.tl-row{display:grid;grid-template-columns:180px 24px 1fr;gap:0;align-items:start;margin-bottom:18px}
.tl-date-col{text-align:right;padding-right:16px;padding-top:3px}
.tl-date-main{font-size:13px;font-weight:600;color:var(--text)}
.tl-date-sub{font-size:11px;color:var(--text3)}
.tl-spine{display:flex;flex-direction:column;align-items:center}
.tl-node{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.tl-line{width:1px;background:var(--border);flex:1;margin-top:3px;min-height:50px}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;margin-left:16px}
.tl-proj{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.04em;margin-bottom:2px}
.tl-task{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,23,48,.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:min(520px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600;color:var(--text)}
.modal-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;line-height:1}
.modal-body{padding:16px 24px 24px;display:flex;flex-direction:column;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2)}
.form-input{padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;transition:border .12s}
.form-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.mf-btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}
.mf-btn:hover{background:var(--surface2)}
.mf-btn.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:600}
.top-controls{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input{padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;width:220px}
.filter-select{padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.btn-primary{padding:8px 14px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.btn-primary:hover{opacity:.9}
.toast-wrap{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:300;pointer-events:none}
.toast{padding:12px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transform:translateX(20px);transition:all .3s;pointer-events:auto;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(0)}
.toast.success{background:#1A8C63;color:white}
.toast.warn{background:#C07010;color:white}
.toast.info{background:#3060B0;color:white}
.toast.err{background:#B83030;color:white}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(247,246,243,.85);z-index:400;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.setup-banner{background:var(--warn-soft);border:1px solid #F0D0A0;border-radius:var(--radius-lg);padding:16px;margin-bottom:20px;font-size:13px;color:var(--warn)}
.setup-banner strong{display:block;font-size:14px;margin-bottom:6px}
.setup-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px}
.alarm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
.alarm-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:13px;color:var(--text2)}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:10px;cursor:pointer;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:white;border-radius:50%;transition:transform .2s;pointer-events:none}
.toggle input:checked~.toggle-thumb{transform:translateX(16px)}
.hist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hist-time{font-size:11px;color:var(--text3);white-space:nowrap;margin-left:auto}
</style>
</head>
<body>

<!-- ★ 여기에 Apps Script 배포 URL을 입력하세요 ★ -->
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAZ1BcxqEtYjI5WgR-bF1ZPcaxW7WATjonf8Mq14dvhGAu7HICbLsnGhcSbJWenKHL/exec";
// 예시: "https://script.google.com/macros/s/AKfy...abc/exec"
</script>

<div class="toast-wrap" id="toast-wrap"></div>
<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <span style="font-size:13px;color:var(--text2)">데이터 저장 중...</span>
</div>

<div class="layout">
<div class="sidebar">
  <div class="sb-header">
    <div class="sb-logo">
      <div class="sb-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"/></svg>
      </div>
      <div>
        <div class="sb-org">청렴감사팀</div>
        <div class="sb-year">2026 공유 대시보드</div>
      </div>
    </div>
  </div>
  <div class="sb-nav">
    <div class="sb-section">메뉴</div>
    <button class="nav-btn active" onclick="showPage('dashboard',this)">📊 대시보드</button>
    <button class="nav-btn" onclick="showPage('timeline',this)">📅 타임라인 <span class="nav-count" id="nc-tl">0</span></button>
    <button class="nav-btn" onclick="showPage('tasks',this)">📋 전체 업무 <span class="nav-count" id="nc-tasks">0</span></button>
    <button class="nav-btn" onclick="showPage('alarms',this)">🔔 알람 <span class="nav-count" id="nc-alarms" style="background:var(--danger-soft);color:var(--danger)">0</span></button>
    <div class="sb-section" style="margin-top:12px">프로젝트</div>
    <div id="proj-nav"></div>
  </div>
  <div class="sb-footer">
    <div class="sb-sync">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-label">Google Sheets 연결됨</span>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:4px">마지막 동기화: <span id="last-sync">-</span></div>
    <button onclick="loadAll()" style="margin-top:8px;width:100%;padding:6px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit">🔄 새로고침</button>
    <button onclick="exportSharedHTML()" style="margin-top:6px;width:100%;padding:8px;border-radius:var(--radius);border:none;background:var(--accent);color:white;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📤 공유용 사본 내보내기</button>
  </div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
  <div class="page-title">대시보드</div>
  <div class="page-sub">2026년 청렴감사팀 업무 현황</div>
  <div id="setup-banner-wrap"></div>
  <div class="stats" id="stats-row"></div>
  <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px">⚠️ 주의 필요 업무</div>
  <div class="alert-list" id="alert-list"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px">프로젝트별 진행률</div>
      <div id="proj-progress"></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px">월별 마감 업무</div>
      <div id="monthly-chart"></div>
    </div>
  </div>
  <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px">이번 달 마감 업무</div>
  <div class="tasks-grid" id="upcoming-tasks"></div>
</div>

<!-- TIMELINE -->
<div class="page" id="page-timeline">
  <div class="page-title">타임라인</div>
  <div class="page-sub">전체 업무 일정</div>
  <div class="top-controls">
    <input class="search-input" type="text" placeholder="업무 검색..." oninput="renderTimeline()" id="tl-search">
    <select class="filter-select" onchange="renderTimeline()" id="tl-proj-filter"><option value="">전체 프로젝트</option></select>
    <select class="filter-select" onchange="renderTimeline()" id="tl-month-filter">
      <option value="">전체 월</option>
      <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
      <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
      <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
      <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
    </select>
  </div>
  <div class="tl-wrap" id="tl-wrap"></div>
</div>

<!-- TASKS -->
<div class="page" id="page-tasks">
  <div class="page-title">전체 업무</div>
  <div class="page-sub">담당자 배정 · 상태 관리 · 자료 업로드</div>
  <div class="top-controls">
    <input class="search-input" type="text" placeholder="업무·담당자 검색..." oninput="renderTasks()" id="task-search">
    <select class="filter-select" onchange="renderTasks()" id="task-status-filter">
      <option value="">전체 상태</option>
      <option>완료</option><option>진행중</option><option>예정</option><option>지연</option><option>검토중</option>
    </select>
    <select class="filter-select" onchange="renderTasks()" id="task-proj-filter"><option value="">전체 프로젝트</option></select>
    <button class="btn-primary" onclick="openAddModal()">+ 업무 추가</button>
  </div>
  <div class="tasks-grid" id="tasks-grid"></div>
</div>

<!-- ALARMS -->
<div class="page" id="page-alarms">
  <div class="page-title">알람 설정</div>
  <div class="page-sub">기일 알림 관리</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="alarm-card">
      <div class="alarm-card-title">알람 설정</div>
      <div class="toggle-row"><span class="toggle-label">D-7 사전 알림</span><label class="toggle"><input type="checkbox" id="al-d7" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label></div>
      <div class="toggle-row"><span class="toggle-label">D-3 긴급 알림</span><label class="toggle"><input type="checkbox" id="al-d3" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label></div>
      <div class="toggle-row"><span class="toggle-label">D-1 당일 알림</span><label class="toggle"><input type="checkbox" id="al-d1" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label></div>
      <div class="toggle-row"><span class="toggle-label">기일 초과 알림</span><label class="toggle"><input type="checkbox" id="al-over" checked><div class="toggle-track"></div><div class="toggle-thumb"></div></label></div>
    </div>
    <div class="alarm-card">
      <div class="alarm-card-title">현재 알림 현황</div>
      <div id="alarm-summary"></div>
    </div>
  </div>
  <div class="alarm-card">
    <div class="alarm-card-title">알람 기록 (Google Sheets 저장)</div>
    <div id="alarm-history"></div>
  </div>
</div>

</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
<div class="modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title">업무 추가</div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="f-id">
    <div class="form-group"><label class="form-label">프로젝트 <span style="font-weight:400;color:var(--text3)">(기존 선택 또는 새로 입력)</span></label>
    <input class="form-input" id="f-project" list="proj-list" placeholder="프로젝트명 입력 또는 선택">
    <datalist id="proj-list"></datalist></div>
    <div class="form-group"><label class="form-label">업무명</label><input class="form-input" id="f-title" placeholder="업무 제목"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">마감일</label><input class="form-input" type="date" id="f-date"></div>
      <div class="form-group"><label class="form-label">상태</label><select class="form-input" id="f-status"><option>예정</option><option>진행중</option><option>검토중</option><option>완료</option><option>지연</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">담당자</label><input class="form-input" id="f-assignee" placeholder="담당자 이름"></div>
      <div class="form-group"><label class="form-label">우선순위</label><select class="form-input" id="f-priority"><option>보통</option><option>높음</option><option>낮음</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">메모</label><textarea class="form-input" id="f-note" rows="2" placeholder="추가 메모" style="resize:vertical"></textarea></div>
    <div class="modal-footer">
      <button class="mf-btn" onclick="closeModal()">취소</button>
      <button class="mf-btn primary" onclick="saveTask()">저장 → Sheets</button>
    </div>
  </div>
</div>
</div>

<script>
// ── 설정 ─────────────────────────────────────────────────────────
const TODAY = new Date('2026-03-20');
const PROJ_COLORS = {
  '2025년 제도개선 TFT':'#2060B0',
  '수의계약 제도개선(안)':'#1A7060',
  '2026년 윤리경영 추진계획':'#8B4020',
  '2026년 연간 감사 계획':'#404040',
  '2026년 부패방지 시책 추진계획':'#6B3090',
  '2025년 실적 경영평가 보고서':'#4B3FA8',
};

let tasks = [];
let files = [];
let alarmLog = [];
let isConnected = false;

// ── API 통신 ──────────────────────────────────────────────────────
async function apiGet(action) {
  const url = SCRIPT_URL + '?action=' + action + '&t=' + Date.now();
  const res = await fetch(url);
  return res.json();
}

async function apiPost(data) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(data),
  });
  return res.json();
}

// ── 데이터 로드 ───────────────────────────────────────────────────
async function loadAll() {
  setSyncStatus('loading', '동기화 중...');
  try {
    const [t, f, a] = await Promise.all([
      apiGet('getTasks'),
      apiGet('getFiles'),
      apiGet('getAlarmLog'),
    ]);
    tasks = Array.isArray(t) ? t.map(row => ({...row, files:[]})) : [];
    files = Array.isArray(f) ? f : [];
    alarmLog = Array.isArray(a) ? a : [];

    // 파일을 각 태스크에 연결
    files.forEach(file => {
      const task = tasks.find(t => String(t.id) === String(file.taskId));
      if (task) task.files.push(file);
    });

    isConnected = true;
    setSyncStatus('ok', 'Google Sheets 연결됨');
    document.getElementById('last-sync').textContent = new Date().toLocaleTimeString('ko-KR');
    refreshAll();
    showToast('데이터를 불러왔습니다.', 'success');
  } catch(e) {
    isConnected = false;
    setSyncStatus('err', '연결 실패');
    showToast('Sheets 연결에 실패했습니다. URL을 확인하세요.', 'err');
    showSetupBanner();
  }
}

function setSyncStatus(state, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.className = 'sync-dot' + (state === 'err' ? ' err' : state === 'loading' ? ' loading' : '');
  lbl.textContent = label;
}

function showSetupBanner() {
  document.getElementById('setup-banner-wrap').innerHTML = `
    <div class="setup-banner">
      <strong>⚙️ Google Sheets 연결 설정이 필요합니다</strong>
      1. <code>appsscript_code.gs</code> 파일을 Google Sheets → 확장 프로그램 → Apps Script에 붙여넣기<br>
      2. <code>setupSheets()</code> 함수를 한 번 실행<br>
      3. 배포 → 새 배포 → 웹 앱 → 액세스: <strong>모든 사용자</strong> → 배포<br>
      4. 생성된 URL을 이 HTML 파일 상단 <code>SCRIPT_URL</code>에 입력 후 저장<br>
      5. 팀원들에게 HTML 파일을 공유하면 모두 같은 Sheets를 바라봅니다.
    </div>`;
}

// ── HELPERS ───────────────────────────────────────────────────────
const diffDays = d => Math.round((new Date(d) - TODAY) / 86400000);
const fmtDate = d => { const dt=new Date(d); return `${dt.getMonth()+1}월 ${dt.getDate()}일`; };
const initials = n => n ? n.charAt(0) : '?';
const projColor = p => PROJ_COLORS[p] || '#888';

// ── RENDER ALL ────────────────────────────────────────────────────
function refreshAll() {
  populateFilters();
  updateCounts();
  renderDashboard();
  renderTimeline();
  renderTasks();
  renderAlarms();
}

function populateFilters() {
  const projects = [...new Set(tasks.map(t=>t.project))];
  ['tl-proj-filter','task-proj-filter'].forEach(id=>{
    const el=document.getElementById(id);
    el.innerHTML='<option value="">전체 프로젝트</option>'+projects.map(p=>`<option value="${p}">${p}</option>`).join('');
  });
  const dl=document.getElementById('proj-list');
  if(dl) dl.innerHTML=projects.map(p=>`<option value="${p}">`).join('');
  document.getElementById('proj-nav').innerHTML=projects.map(p=>`
    <div class="proj-item" onclick="filterByProj('${p.replace(/'/g,"\\'")}')">
      <span class="proj-dot" style="background:${projColor(p)}"></span>
      <span class="proj-name">${p}</span>
    </div>`).join('');
}

function updateCounts() {
  const urgent = tasks.filter(t=>t.status!=='완료'&&(diffDays(t.date)<0||diffDays(t.date)<=7)).length;
  document.getElementById('nc-tasks').textContent=tasks.filter(t=>t.status!=='완료').length;
  document.getElementById('nc-tl').textContent=tasks.length;
  document.getElementById('nc-alarms').textContent=urgent;
}

// ── DASHBOARD ─────────────────────────────────────────────────────
function renderDashboard() {
  const total=tasks.length, done=tasks.filter(t=>t.status==='완료').length;
  const inProg=tasks.filter(t=>t.status==='진행중').length;
  const delayed=tasks.filter(t=>t.status==='지연').length;
  const urgent=tasks.filter(t=>t.status!=='완료'&&diffDays(t.date)>=0&&diffDays(t.date)<=7).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat accent"><div class="stat-label">전체 완료율</div><div class="stat-val">${pct}%</div><div class="stat-sub">${done}/${total}</div></div>
    <div class="stat"><div class="stat-label">전체 업무</div><div class="stat-val">${total}</div><div class="stat-sub">6개 프로젝트</div></div>
    <div class="stat"><div class="stat-label">진행중</div><div class="stat-val" style="color:var(--info)">${inProg}</div></div>
    <div class="stat"><div class="stat-label">지연</div><div class="stat-val" style="color:var(--danger)">${delayed}</div></div>
    <div class="stat"><div class="stat-label">D-7 이내</div><div class="stat-val" style="color:var(--warn)">${urgent}</div></div>`;

  const alerts=[];
  tasks.forEach(t=>{
    if(t.status==='완료') return;
    const d=diffDays(t.date);
    if(d<0) alerts.push({type:'danger',msg:`<strong>[${t.project}]</strong> ${t.title} — 기일 ${Math.abs(d)}일 초과`,date:fmtDate(t.date)});
    else if(d<=3) alerts.push({type:'danger',msg:`<strong>[${t.project}]</strong> ${t.title} — D-${d}`,date:fmtDate(t.date)});
    else if(d<=7) alerts.push({type:'warn',msg:`<strong>[${t.project}]</strong> ${t.title} — D-${d}`,date:fmtDate(t.date)});
  });
  document.getElementById('alert-list').innerHTML=alerts.length
    ? alerts.slice(0,5).map(a=>`<div class="alert-item ${a.type}"><span style="flex:1">${a.msg}</span><span style="font-size:11px;opacity:.8">${a.date}</span></div>`).join('')
    : '<div style="font-size:13px;color:var(--text3)">현재 긴급 알림 없음</div>';

  const projs=[...new Set(tasks.map(t=>t.project))];
  document.getElementById('proj-progress').innerHTML=projs.map(p=>{
    const pt=tasks.filter(t=>t.project===p), pd=pt.filter(t=>t.status==='완료').length;
    const pct=Math.round(pd/pt.length*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--text2)"><span>${p}</span><span>${pd}/${pt.length} (${pct}%)</span></div>
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;background:${projColor(p)};width:${pct}%"></div></div>
    </div>`;
  }).join('');

  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const mc=months.map((m,i)=>({m,total:tasks.filter(t=>new Date(t.date).getMonth()===i).length,done:tasks.filter(t=>new Date(t.date).getMonth()===i&&t.status==='완료').length}));
  const maxV=Math.max(...mc.map(m=>m.total),1);
  document.getElementById('monthly-chart').innerHTML=`
    <div style="display:flex;align-items:flex-end;gap:3px;height:80px">
      ${mc.map(m=>{const h=Math.round(m.total/maxV*72),hd=Math.round(m.done/maxV*72);return`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
          <div style="width:100%;height:${h}px;background:var(--info-soft);border-radius:3px 3px 0 0;display:flex;flex-direction:column-reverse;overflow:hidden">
            <div style="width:100%;height:${hd}px;background:var(--accent)"></div>
          </div>
          <span style="font-size:9px;color:var(--text3)">${m.m.replace('월','')}</span>
        </div>`;}).join('')}
    </div>`;

  const curMonth=TODAY.getMonth();
  const upcoming=tasks.filter(t=>new Date(t.date).getMonth()===curMonth&&t.status!=='완료').sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById('upcoming-tasks').innerHTML=upcoming.length
    ? upcoming.slice(0,6).map(t=>renderCard(t)).join('')
    : '<div style="font-size:13px;color:var(--text3);grid-column:1/-1">이번 달 예정 업무 없음</div>';
}

// ── TASK CARD ─────────────────────────────────────────────────────
function renderCard(t) {
  const diff=diffDays(t.date);
  const dLabel=t.status==='완료'?'':diff<0?`D+${Math.abs(diff)}`:diff===0?'D-Day':`D-${diff}`;
  const dColor=diff<0?'var(--danger)':diff<=3?'var(--danger)':diff<=7?'var(--warn)':'var(--text3)';
  const color=projColor(t.project);
  const fileArr=Array.isArray(t.files)?t.files:[];
  return `<div class="task-card">
    <div style="height:3px;background:${color};border-radius:12px 12px 0 0"></div>
    <div class="tc-header">
      <div class="tc-info">
        <div class="tc-project">${t.project}</div>
        <div class="tc-title">${t.title}</div>
      </div>
      <span class="status-badge st-${t.status}" onclick="cycleStatus(${t.id})" title="클릭으로 상태 변경">${t.status}</span>
    </div>
    <div class="tc-body">
      <div class="tc-meta">
        <span class="tc-date">📅 ${fmtDate(t.date)} ${dLabel?`<span style="font-weight:600;color:${dColor}">(${dLabel})</span>`:''}</span>
        <span class="tc-assignee" onclick="openEditModal(${t.id})"><span class="tc-avatar">${initials(t.assignee)}</span>${t.assignee||'미배정'}</span>
        ${t.priority==='높음'?`<span style="font-size:10px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:2px 6px;border-radius:4px">HIGH</span>`:''}
      </div>
      ${t.note?`<div style="font-size:12px;color:var(--text3);margin-bottom:6px">${t.note}</div>`:''}
      ${fileArr.length?`<div class="tc-files">${fileArr.map((f,i)=>{const ext=(f.name||'').split('.').pop().toLowerCase();return`<span class="file-chip"><span class="file-ext ext-${ext}">${ext.toUpperCase()}</span>${(f.name||'').length>16?(f.name||'').slice(0,14)+'…':(f.name||'')}<span onclick="deleteFile(${f.id||i},${t.id})" style="margin-left:2px;color:var(--text3);cursor:pointer;font-weight:700">×</span></span>`;}).join('')}</div>`:''}
      <div class="upload-area" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event,${t.id})">
        <input type="file" multiple onchange="handleFiles(this,${t.id})" onclick="event.stopPropagation()">
        <div class="upload-txt">자료 <strong>드래그 또는 클릭</strong>으로 업로드 (Sheets에 저장)</div>
        <div class="prog-bar" id="pb-${t.id}"><div class="prog-fill" id="pf-${t.id}"></div></div>
      </div>
    </div>
    <div class="tc-footer">
      <button class="tc-btn" onclick="openEditModal(${t.id})">수정</button>
      <button class="tc-btn" onclick="cycleStatus(${t.id})">상태 변경</button>
      <button class="tc-btn" style="margin-left:auto;color:var(--danger)" onclick="doDeleteTask(${t.id})">삭제</button>
    </div>
  </div>`;
}

// ── TASKS PAGE ────────────────────────────────────────────────────
function renderTasks() {
  const q=(document.getElementById('task-search').value||'').toLowerCase();
  const sf=document.getElementById('task-status-filter').value;
  const pf=document.getElementById('task-proj-filter').value;
  let filtered=tasks.filter(t=>{
    const mq=!q||t.title.toLowerCase().includes(q)||t.project.toLowerCase().includes(q)||(t.assignee&&t.assignee.toLowerCase().includes(q));
    return mq&&(!sf||t.status===sf)&&(!pf||t.project===pf);
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById('tasks-grid').innerHTML=filtered.length
    ? filtered.map(t=>renderCard(t)).join('')
    : '<div style="grid-column:1/-1;font-size:13px;color:var(--text3)">검색 결과 없음</div>';
}

// ── TIMELINE ──────────────────────────────────────────────────────
function renderTimeline() {
  const q=(document.getElementById('tl-search').value||'').toLowerCase();
  const pf=document.getElementById('tl-proj-filter').value;
  const mf=document.getElementById('tl-month-filter').value;
  let filtered=tasks.filter(t=>{
    const mq=!q||t.title.toLowerCase().includes(q)||t.project.toLowerCase().includes(q);
    const mm=!mf||(new Date(t.date).getMonth()+1)===parseInt(mf);
    return mq&&(!pf||t.project===pf)&&mm;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));

  const byMonth={};
  filtered.forEach(t=>{const d=new Date(t.date),k=`${d.getFullYear()}년 ${d.getMonth()+1}월`;if(!byMonth[k])byMonth[k]=[];byMonth[k].push(t);});
  document.getElementById('tl-wrap').innerHTML=Object.entries(byMonth).map(([month,items])=>`
    <div class="tl-month-head">${month}</div>
    ${items.map(t=>{
      const color=projColor(t.project),diff=diffDays(t.date);
      const dLabel=t.status==='완료'?'':diff<0?`D+${Math.abs(diff)}`:diff===0?'D-Day':`D-${diff}`;
      const dColor=diff<0&&t.status!=='완료'?'var(--danger)':diff<=7&&t.status!=='완료'?'var(--warn)':'var(--text3)';
      return `<div class="tl-row">
        <div class="tl-date-col"><div class="tl-date-main">${fmtDate(t.date)}</div><div class="tl-date-sub" style="color:${dColor}">${dLabel}</div></div>
        <div class="tl-spine"><div class="tl-node" style="background:${color}"></div><div class="tl-line"></div></div>
        <div class="tl-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px">
            <div><div class="tl-proj" style="color:${color}">${t.project}</div><div class="tl-task">${t.title}</div></div>
            <span class="status-badge st-${t.status}">${t.status}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text3)">
            <span class="tc-assignee"><span class="tc-avatar">${initials(t.assignee)}</span>${t.assignee||'미배정'}</span>
            ${(t.files||[]).length?`<span>📎 ${t.files.length}개 첨부</span>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  `).join('');
}

// ── ALARMS ────────────────────────────────────────────────────────
function renderAlarms() {
  const delayed=tasks.filter(t=>t.status!=='완료'&&diffDays(t.date)<0).length;
  const soon=tasks.filter(t=>t.status!=='완료'&&diffDays(t.date)>=0&&diffDays(t.date)<=3).length;
  const week=tasks.filter(t=>t.status!=='완료'&&diffDays(t.date)>3&&diffDays(t.date)<=7).length;
  document.getElementById('alarm-summary').innerHTML=`
    <div class="toggle-row"><span class="toggle-label" style="color:var(--danger)">기일 초과</span><span style="font-size:14px;font-weight:700;color:var(--danger)">${delayed}건</span></div>
    <div class="toggle-row"><span class="toggle-label" style="color:var(--warn)">D-3 이내 긴급</span><span style="font-size:14px;font-weight:700;color:var(--warn)">${soon}건</span></div>
    <div class="toggle-row"><span class="toggle-label">D-7 이내 예정</span><span style="font-size:14px;font-weight:700;color:var(--accent)">${week}건</span></div>
    <div class="toggle-row"><span class="toggle-label">완료</span><span style="font-size:14px;font-weight:700;color:var(--done)">${tasks.filter(t=>t.status==='완료').length}건</span></div>`;
  document.getElementById('alarm-history').innerHTML=alarmLog.length
    ? alarmLog.slice(0,20).map(a=>`<div class="hist-item">
        <span class="hist-dot" style="background:${a.type==='danger'?'var(--danger)':a.type==='warn'?'var(--warn)':'var(--info)'}"></span>
        <span style="flex:1;font-size:13px;color:var(--text2)">${a.message||a.msg||''}</span>
        <span class="hist-time">${String(a.time||'').slice(0,16)}</span>
      </div>`).join('')
    : '<div style="font-size:13px;color:var(--text3)">알람 기록 없음</div>';
}

// ── FILE UPLOAD ───────────────────────────────────────────────────
function handleDrop(e,id){e.preventDefault();e.stopPropagation();uploadFiles(Array.from(e.dataTransfer.files),id);}
function handleFiles(input,id){uploadFiles(Array.from(input.files),id);}

async function uploadFiles(fileList, taskId) {
  const pb=document.getElementById('pb-'+taskId);
  const pf=document.getElementById('pf-'+taskId);
  if(pb) pb.style.display='block';
  let p=0;
  const iv=setInterval(()=>{p+=Math.random()*20+10;if(pf)pf.style.width=Math.min(p,95)+'%';if(p>=95)clearInterval(iv);},80);

  for(const file of fileList) {
    const ext=file.name.split('.').pop().toLowerCase();
    const sz=file.size<1024?file.size+'B':file.size<1048576?Math.round(file.size/1024)+'KB':(file.size/1048576).toFixed(1)+'MB';
    await apiPost({action:'addFile',file:{taskId,name:file.name,size:sz,ext,uploadedBy:'팀원'}});
    await apiPost({action:'addAlarmLog',entry:{type:'info',message:`[파일 업로드] ${file.name} → 업무 #${taskId}`,time:new Date().toISOString()}});
  }

  clearInterval(iv);
  if(pf)pf.style.width='100%';
  setTimeout(()=>{if(pb)pb.style.display='none';if(pf)pf.style.width='0%';},400);
  showToast(`파일 ${fileList.length}개가 Sheets에 저장되었습니다.`,'success');
  await loadAll();
}

async function deleteFile(fileId, taskId) {
  await apiPost({action:'deleteFile',id:fileId});
  showToast('파일이 삭제되었습니다.','info');
  await loadAll();
}

// ── STATUS ────────────────────────────────────────────────────────
const STATUS_CYCLE=['예정','진행중','검토중','완료','지연'];
async function cycleStatus(id) {
  const task=tasks.find(t=>t.id==id);
  if(!task) return;
  const i=STATUS_CYCLE.indexOf(task.status);
  task.status=STATUS_CYCLE[(i+1)%STATUS_CYCLE.length];
  showOverlay(true);
  await apiPost({action:'saveTask',task});
  await apiPost({action:'addAlarmLog',entry:{type:'info',message:`[상태 변경] ${task.title} → ${task.status}`,time:new Date().toISOString()}});
  showOverlay(false);
  showToast(`"${task.status}"으로 변경되어 Sheets에 저장됐습니다.`,'success');
  await loadAll();
}

// ── MODAL ─────────────────────────────────────────────────────────
let editingId=null;
function openAddModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='새 업무 추가';
  document.getElementById('f-id').value='';
  ['f-title','f-assignee','f-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-date').value='';
  document.getElementById('f-status').value='예정';
  document.getElementById('f-priority').value='보통';
  document.getElementById('modal-bg').classList.add('open');
}
function openEditModal(id){
  const t=tasks.find(t=>t.id==id); if(!t) return;
  editingId=id;
  document.getElementById('modal-title').textContent='업무 수정';
  document.getElementById('f-id').value=id;
  document.getElementById('f-project').value=t.project;
  document.getElementById('f-title').value=t.title;
  document.getElementById('f-date').value=t.date;
  document.getElementById('f-status').value=t.status;
  document.getElementById('f-assignee').value=t.assignee||'';
  document.getElementById('f-priority').value=t.priority||'보통';
  document.getElementById('f-note').value=t.note||'';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}

async function saveTask() {
  const title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  const taskData={
    id:editingId||null,
    project:document.getElementById('f-project').value,
    title,
    date:document.getElementById('f-date').value||'2026-12-31',
    status:document.getElementById('f-status').value,
    assignee:document.getElementById('f-assignee').value.trim(),
    priority:document.getElementById('f-priority').value,
    note:document.getElementById('f-note').value.trim(),
  };
  closeModal();
  showOverlay(true);
  await apiPost({action:'saveTask',task:taskData});
  showOverlay(false);
  showToast(editingId?'업무가 Sheets에 저장됐습니다.':'새 업무가 Sheets에 추가됐습니다.','success');
  await loadAll();
}

async function doDeleteTask(id) {
  showOverlay(true);
  await apiPost({action:'deleteTask',id});
  showOverlay(false);
  showToast('업무가 삭제됐습니다.','info');
  await loadAll();
}

// ── UTILS ─────────────────────────────────────────────────────────
function filterByProj(proj){showPage('tasks',document.querySelectorAll('.nav-btn')[2]);document.getElementById('task-proj-filter').value=proj;renderTasks();}
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
}
function showToast(msg,type='info'){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className=`toast ${type}`;el.textContent=msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>wrap.removeChild(el),400);},3500);
}
function showOverlay(show){document.getElementById('loading-overlay').className='loading-overlay'+(show?' show':'');}

document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── 공유용 사본 내보내기 ───────────────────────────────────────────
function exportSharedHTML() {
  if(!tasks.length){showToast('먼저 데이터를 불러와 주세요.','warn');return;}
  const today = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const PROJ_COLORS_EXP = {
    '2025년 제도개선 TFT':'#2060B0','수의계약 제도개선(안)':'#1A7060',
    '2026년 윤리경영 추진계획':'#8B4020','2026년 연간 감사 계획':'#404040',
    '2026년 부패방지 시책 추진계획':'#6B3090','2025년 실적 경영평가 보고서':'#4B3FA8',
  };
  const fmtD = d=>{const dt=new Date(d);return `${dt.getMonth()+1}월 ${dt.getDate()}일`;};
  const diff = d=>Math.round((new Date(d)-new Date())/86400000);
  const stColor = {
    '완료':'background:#E6F5EF;color:#1A8C63',
    '진행중':'background:#E8F0FA;color:#2060B0',
    '예정':'background:#EEECfb;color:#3530A0',
    '지연':'background:#FCEAEA;color:#B83030',
    '검토중':'background:#FEF4E0;color:#C07010',
  };

  // 통계
  const total=tasks.length, done=tasks.filter(t=>t.status==='완료').length;
  const inProg=tasks.filter(t=>t.status==='진행중').length;
  const delayed=tasks.filter(t=>t.status==='지연').length;
  const pct=total?Math.round(done/total*100):0;

  // 프로젝트별 진행률
  const projs=[...new Set(tasks.map(t=>t.project))];
  const projBars=projs.map(p=>{
    const pt=tasks.filter(t=>t.project===p),pd=pt.filter(t=>t.status==='완료').length;
    const pc=Math.round(pd/pt.length*100),color=PROJ_COLORS_EXP[p]||'#888';
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#555">
        <span style="font-weight:600;color:${color}">${p}</span><span>${pd}/${pt.length} (${pc}%)</span>
      </div>
      <div style="height:7px;background:#eee;border-radius:4px;overflow:hidden">
        <div style="height:100%;background:${color};width:${pc}%;border-radius:4px"></div>
      </div>
    </div>`;
  }).join('');

  // 타임라인
  const sorted=[...tasks].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const byMonth={};
  sorted.forEach(t=>{
    const d=new Date(t.date),k=`${d.getFullYear()}년 ${d.getMonth()+1}월`;
    if(!byMonth[k])byMonth[k]=[];byMonth[k].push(t);
  });
  const tlHTML=Object.entries(byMonth).map(([month,items])=>`
    <div style="font-size:11px;font-weight:700;color:#999;letter-spacing:.06em;padding:16px 0 8px;border-bottom:1px solid #eee;margin-bottom:12px">${month}</div>
    ${items.map(t=>{
      const color=PROJ_COLORS_EXP[t.project]||'#888';
      const d=diff(t.date),st=stColor[t.status]||'background:#eee;color:#888';
      const dLabel=t.status==='완료'?'':d<0?`D+${Math.abs(d)}`:d===0?'D-Day':`D-${d}`;
      const dColor=d<0&&t.status!=='완료'?'#B83030':d<=7&&t.status!=='완료'?'#C07010':'#999';
      return `<div style="display:grid;grid-template-columns:120px 20px 1fr;gap:0;margin-bottom:16px;align-items:start">
        <div style="text-align:right;padding-right:14px;padding-top:3px">
          <div style="font-size:12px;font-weight:600;color:#333">${fmtD(t.date)}</div>
          <div style="font-size:11px;color:${dColor}">${dLabel}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center">
          <div style="width:10px;height:10px;border-radius:50%;background:${color};margin-top:4px;flex-shrink:0"></div>
          <div style="width:1px;background:#e0e0e0;flex:1;margin-top:3px;min-height:40px"></div>
        </div>
        <div style="background:white;border:1px solid #eee;border-radius:10px;padding:10px 14px;margin-left:12px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px">
            <div>
              <div style="font-size:10px;font-weight:700;color:${color};letter-spacing:.04em;margin-bottom:2px">${t.project}</div>
              <div style="font-size:13px;font-weight:600;color:#1A1730">${t.title}</div>
            </div>
            <span style="font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;${st}">${t.status}</span>
          </div>
          <div style="font-size:12px;color:#888">${t.assignee||'미배정'}</div>
          ${t.note?`<div style="font-size:11px;color:#aaa;margin-top:4px">${t.note}</div>`:''}
        </div>
      </div>`;
    }).join('')}
  `).join('');

  const html = `<!DOCTYPE html>
<html lang="ko">
<head>

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
